<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" font-family="'Inter',system-ui,sans-serif">
  <rect width="760" height="310" fill="#F7F9FC" rx="12"/>
  <text x="380" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Extension slots: loose-coupled UI composition</text>

  <!-- Pilet A: declares slot -->
  <rect x="24" y="44" width="296" height="230" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="172" y="67" text-anchor="middle" font-size="13" font-weight="600" fill="#1D4ED8">Pilet A — Cart page</text>
  <line x1="40" y1="74" x2="304" y2="74" stroke="#BFDBFE" stroke-width="1"/>
  <!-- Mockup page content -->
  <rect x="40" y="82" width="264" height="182" rx="5" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="1"/>
  <rect x="50" y="92" width="150" height="13" rx="3" fill="#DBEAFE"/>
  <text x="125" y="103" text-anchor="middle" font-size="10" fill="#1D4ED8">CartItemList</text>
  <rect x="50" y="112" width="110" height="13" rx="3" fill="#DBEAFE"/>
  <text x="105" y="123" text-anchor="middle" font-size="10" fill="#1D4ED8">CartSummary</text>
  <!-- Slot box (dashed) -->
  <rect x="50" y="132" width="244" height="60" rx="4" fill="#F0FFF4" stroke="#22C55E" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="172" y="157" text-anchor="middle" font-size="10" fill="#15803D" font-family="'JetBrains Mono',monospace">&lt;ExtensionSlot</text>
  <text x="172" y="172" text-anchor="middle" font-size="10" fill="#15803D" font-family="'JetBrains Mono',monospace">  name="cart-extra" /&gt;</text>
  <text x="172" y="202" text-anchor="middle" font-size="10" fill="#16A34A">← any pilet can fill this slot</text>
  <text x="172" y="255" text-anchor="middle" font-size="10" fill="#3B82F6">Pilet A has no knowledge of</text>
  <text x="172" y="268" text-anchor="middle" font-size="10" fill="#3B82F6">who fills the slot</text>

  <!-- Pilet B: fills slot -->
  <rect x="440" y="44" width="296" height="230" rx="8" fill="#FAF5FF" stroke="#D8B4FE" stroke-width="1.5"/>
  <text x="588" y="67" text-anchor="middle" font-size="13" font-weight="600" fill="#6B21A8">Pilet B — Promotions</text>
  <line x1="456" y1="74" x2="720" y2="74" stroke="#E9D5FF" stroke-width="1"/>
  <text x="588" y="97" text-anchor="middle" font-size="11" fill="#7C3AED">In setup(api):</text>
  <rect x="456" y="104" width="264" height="62" rx="5" fill="#F3E8FF" stroke="#E9D5FF" stroke-width="1"/>
  <text x="588" y="124" text-anchor="middle" font-size="10" fill="#6B21A8" font-family="'JetBrains Mono',monospace">api.registerExtension(</text>
  <text x="588" y="140" text-anchor="middle" font-size="10" fill="#6B21A8" font-family="'JetBrains Mono',monospace">  'cart-extra',</text>
  <text x="588" y="156" text-anchor="middle" font-size="10" fill="#6B21A8" font-family="'JetBrains Mono',monospace">  PromoWidget)</text>
  <!-- Rendered result -->
  <rect x="456" y="178" width="264" height="64" rx="5" fill="#FFFFFF" stroke="#E9D5FF" stroke-width="1"/>
  <text x="588" y="200" text-anchor="middle" font-size="11" fill="#7C3AED">PromoWidget renders inside Pilet A:</text>
  <rect x="470" y="207" width="236" height="28" rx="4" fill="#FAF5FF" stroke="#C084FC" stroke-width="1"/>
  <text x="588" y="226" text-anchor="middle" font-size="12" fill="#7C3AED">🎉  Free shipping over €50!</text>
  <text x="588" y="257" text-anchor="middle" font-size="10" fill="#7C3AED">Pilet B has no knowledge of</text>
  <text x="588" y="270" text-anchor="middle" font-size="10" fill="#7C3AED">which page it appears on</text>

  <!-- Centre: shell connects them -->
  <rect x="328" y="126" width="104" height="58" rx="6" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="380" y="148" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">App Shell</text>
  <text x="380" y="164" text-anchor="middle" font-size="10" fill="#16A34A">Extension</text>
  <text x="380" y="178" text-anchor="middle" font-size="10" fill="#16A34A">Registry</text>
  <!-- Arrows -->
  <line x1="328" y1="155" x2="296" y2="160" stroke="#009D94" stroke-width="2"/>
  <polygon points="298,154 286,160 298,166" fill="#009D94"/>
  <line x1="432" y1="155" x2="464" y2="140" stroke="#009D94" stroke-width="2"/>
  <polygon points="461,134 476,138 463,146" fill="#009D94"/>
</svg>
