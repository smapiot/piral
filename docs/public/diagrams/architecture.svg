<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="'Inter',system-ui,sans-serif">
  <!-- Background -->
  <rect width="760" height="460" fill="#F7F9FC" rx="12"/>
  <!-- Browser chrome -->
  <rect x="20" y="16" width="720" height="330" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="20" y="16" width="720" height="38" rx="10" fill="#F0F4F9" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="20" y="42" width="720" height="12" fill="#F0F4F9"/>
  <circle cx="44" cy="35" r="6" fill="#FC5F57"/>
  <circle cx="62" cy="35" r="6" fill="#FEBC2E"/>
  <circle cx="80" cy="35" r="6" fill="#28C840"/>
  <rect x="100" y="27" width="380" height="16" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
